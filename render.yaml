# Render Blueprint — GOON OS API (NestJS)
# Web fica no Vercel (projeto goon-os-web). Esta blueprint publica só a API.
# Após `render login`, crie via: New → Blueprint (ou `render blueprint launch`).
# Vars com `sync: false` são setadas manualmente (NÃO ficam no git):
#   DATABASE_URL, DIRECT_URL  -> mesma string do Neon (apps/api/.env)
#   JWT_SECRET, JWT_REFRESH_SECRET -> mesmos valores do apps/api/.env
services:
  - type: web
    name: goon-os-api
    runtime: node
    plan: free
    region: virginia            # perto do Neon (us-east-1) -> menor latência
    rootDir: .
    # --include=dev garante typescript/prisma/nest mesmo com NODE_ENV=production
    buildCommand: npm install --include=dev && npm run build --workspace=api
    startCommand: npm run start:prod --workspace=api
    healthCheckPath: /health
    autoDeploy: true            # auto-deploy a cada push na main
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: FRONTEND_URL
        value: https://goon-os-web.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
